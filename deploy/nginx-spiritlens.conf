# SpiritLens + ClawShop 多项目 Nginx 配置
# 安装: sudo cp 本文件 /etc/nginx/sites-available/default
#        sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name 129.28.122.183 www.yhanm.cn yhanm.cn;

    # 客户端上传大小限制（单张图片最大 50MB，一次最多 15 张）
    client_max_body_size 200m;

    # ── 根路径返回 404 ──
    location = / {
        return 404;
    }

    # ── 浏览器默认请求 favicon，指向 SpiritLens 的 ──
    location = /favicon.ico {
        return 302 /spiritlens/favicon.ico;
    }

    # ── ClawShop ──
    location /clawshop/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── SpiritLens API ──
    # 浏览器请求 /spiritlens/api/v1/xxx → nginx 去掉 /spiritlens → 后端收到 /api/v1/xxx
    location /spiritlens/api/ {
        proxy_pass http://127.0.0.1:8085/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 30s;
    }

    # ── SpiritLens WebSocket（任务进度推送） ──
    location /spiritlens/ws/ {
        proxy_pass http://127.0.0.1:8085/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # ── SpiritLens 上传文件（预览图片/视频） ──
    location /spiritlens/uploads/ {
        proxy_pass http://127.0.0.1:8085/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_valid 200 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # ── SpiritLens /spiritlens（无斜杠）直接代理，避免与 Next.js 的 308 循环 ──
    location = /spiritlens {
        proxy_pass http://127.0.0.1:3005/spiritlens;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── SpiritLens Next.js 前端 ──
    # 浏览器请求 /spiritlens/ai-tool/image → nginx 保持 /spiritlens 前缀转发 → Next.js 的 basePath 处理
    location /spiritlens/ {
        proxy_pass http://127.0.0.1:3005/spiritlens/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Override Next.js aggressive caching (s-maxage=31536000)
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
