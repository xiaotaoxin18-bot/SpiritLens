version: "3.8"

services:
  # ─── PostgreSQL ───
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "max_connections=200"]  # 4×uvicorn pool(30) + celery 任务临时连接
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: spiritlens
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Redis ───
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Celery Worker: 图片队列 ───
  celery-image:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.celery_app worker -Q image --pool=threads --concurrency=${CELERY_IMAGE_CONCURRENCY:-16} --prefetch-multiplier=1 --loglevel=info
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${DB_PASSWORD:-postgres}@postgres:5432/spiritlens
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - REDIS_URL=redis://redis:6379/0
      - PUBLIC_URL=http://localhost:8000
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ─── Celery Worker: 视频队列 ───
  celery-video:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.celery_app worker -Q video --pool=threads --concurrency=${CELERY_VIDEO_CONCURRENCY:-16} --prefetch-multiplier=1 --loglevel=info
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${DB_PASSWORD:-postgres}@postgres:5432/spiritlens
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - REDIS_URL=redis://redis:6379/0
      - PUBLIC_URL=http://localhost:8000
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ─── 后端 ───
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${UVICORN_WORKERS:-4}
    ports:
      - "8085:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${DB_PASSWORD:-postgres}@postgres:5432/spiritlens
      - SECRET_KEY=${SECRET_KEY:-}        # 必填，生产环境需设置
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - REDIS_URL=redis://redis:6379/0
      - PUBLIC_URL=http://localhost:8085
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3005
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ─── 前端 ───
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3005:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8085
    depends_on:
      - backend
    restart: unless-stopped

  # ─── 搜索引擎 ───
  searxng:
    image: searxng/searxng:latest
    ports:
      - "8800:8080"
    volumes:
      - ./docker/searxng-config:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8800
    restart: unless-stopped

volumes:
  pgdata:
