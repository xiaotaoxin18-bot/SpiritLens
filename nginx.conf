user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 768;
}

http {

	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers on;

	access_log /var/log/nginx/access.log;

	gzip on;

	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;

    # HTTP 跳转 HTTPS
    server {
        listen 80;
        server_name yhanm.cn www.yhanm.cn;
        return 301 https://$host$request_uri;
    }

    # HTTPS 服务
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name yhanm.cn www.yhanm.cn;

        ssl_certificate /etc/nginx/ssl/yhanm.cn_bundle.crt;
        ssl_certificate_key /etc/nginx/ssl/yhanm.cn.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # SpiritLens API
        location /spiritlens/api/ {
            proxy_pass http://127.0.0.1:8085/api/;
            proxy_read_timeout 300;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # SpiritLens Uploads (图片/视频资源)
        location /spiritlens/uploads/ {
            proxy_pass http://127.0.0.1:8085/uploads/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_cache_valid 200 1h;
            add_header Cache-Control "public, max-age=3600";
        }

        # SpiritLens WebSocket
        location /spiritlens/ws/ {
            proxy_pass http://127.0.0.1:8085/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }

        # SpiritLens Frontend
        location /spiritlens/ {
            proxy_pass http://127.0.0.1:3005/spiritlens/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ClawShop (default)
        location / {
            proxy_pass http://localhost:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
